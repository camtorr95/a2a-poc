version: "3.9"

services:
  router:
    build: ./go
    ports:
      - "8080:8080"
    environment:
      - FLIGHTS_AGENT_URL=http://python-agents:8000
      - HOTELS_AGENT_URL=http://python-agents:8000
      - ITINERARY_AGENT_URL=http://python-agents:8000
    depends_on:
      - python-agents

  python-agents:
    build:
      context: .
      dockerfile: python/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AGENT_PUBLIC_URL=http://python-agents:8000
